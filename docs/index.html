<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galactic Clash</title>
    <meta name="description" content="Real-time top-down tactical space conquest game with randomized star systems, planetary infrastructure, orbital defenses, colony fleets, and AI factions." />
    <meta property="og:title" content="Galactic Clash" />
    <meta property="og:description" content="Real-time top-down tactical space conquest game with randomized star systems, planetary infrastructure, orbital defenses, colony fleets, and AI factions." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hurke-games.github.io/Galactic-Clash/" />
    <link rel="canonical" href="https://hurke-games.github.io/Galactic-Clash/" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="/Galactic-Clash/assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="/Galactic-Clash/assets/index.css">
  </head>
  <body class="bg-slate-950 text-slate-100 select-none font-sans min-h-screen">
    <div id="root"></div>
    <script>
      (function() {
        // Fallback for direct static hosting on GitHub Pages where /src/main.tsx cannot be compiled live by Vite
        var isGitHubPages = window.location.hostname.includes('github.io') || window.location.protocol === 'file:';
        if (isGitHubPages) {
          // Preload compiled stylesheet if not already injected
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = './assets/index.css';
          document.head.appendChild(link);

          // Verify if React mounted via /src/main.tsx; if not, inject the production bundle
          setTimeout(function() {
            if (!window.__GAME_MOUNTED__ && !document.querySelector('canvas')) {
              console.log('[Galactic Clash] Loading production bundle for GitHub Pages...');
              var s = document.createElement('script');
              s.type = 'module';
              s.crossOrigin = 'anonymous';
              s.src = './assets/index.js';
              document.body.appendChild(s);
            }
          }, 60);
        }
      })();
    </script>
  </body>
</html>
